<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Medo - Croatian Stories Bot</title><style>:root{--bg:#fff;--fg:#1f2933;--muted:#616e7c;--line:#e4e7eb;--accent:#1b4332}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--fg:#e4e7eb;--muted:#9aa5b1;--line:#2d343b;--accent:#7bd3a5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px 64px}h1{font-size:1.9rem;margin:.2em 0 .1em}h2{font-size:1.15rem;margin:1.8em 0 .4em}
p,li{margin:.5em 0}ul{padding-left:1.3em}a{color:var(--accent)}.meta{color:var(--muted);font-size:.9rem}
nav{display:flex;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;font-size:.95rem}
main{text-align:center;padding-top:48px}.emoji{font-size:3.2rem;line-height:1}h1{font-size:1.7rem}.tag{color:var(--muted);margin:.4em 0 1.6em}
.btn{display:inline-block;background:var(--accent);color:var(--bg);font-weight:600;text-decoration:none;padding:14px 28px;border-radius:12px;font-size:1.1rem}
.help{display:none;text-align:left;border:2px solid var(--accent);border-radius:12px;padding:6px 18px 16px;margin:0 0 24px}.help h2{margin-top:.9em}
.name{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}.name code{font-size:1.05rem;user-select:all;-webkit-user-select:all;background:var(--line);padding:6px 10px;border-radius:8px}
.name button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}</style></head>
<body><main>
<div class="emoji">🐻</div>
<h1>Medo - Croatian Stories Bot</h1>
<p class="tag" data-en="Learn Croatian with graded stories, audio and a glossary." data-es="Aprende croata con historias graduadas, audio y glosario.">Learn Croatian with graded stories, audio and a glossary.</p>
<div id="help" class="help"></div>
<a id="go" class="btn" href="https://t.me/CroatianStoriesBot?start=web">Open in Telegram</a>
</main><script>(function(){
var T={en:{open:'Open in Telegram',h:'Almost there! TikTok’s browser can’t open Telegram',s1:'Tap the ⋯ menu (top right corner).',s2:'Choose “Open in browser”.',s3:'Tap “Open in Telegram”.',or:'Or search this name in Telegram:',copy:'Copy',ok:'Copied!'},
es:{open:'Abrir en Telegram',h:'¡Casi listo! El navegador de TikTok no puede abrir Telegram',s1:'Toca el menú ⋯ (arriba a la derecha).',s2:'Elige “Abrir en el navegador”.',s3:'Toca “Abrir en Telegram”.',or:'O busca este nombre en Telegram:',copy:'Copiar',ok:'¡Copiado!'}};
var L=(navigator.language||'en').slice(0,2)==='es'?'es':'en';
var tx=T[L];document.documentElement.lang=L;
document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute('data-'+L);});
var q=new URLSearchParams(location.search);var p=q.get('s')||'web';if(!/^[A-Za-z0-9_-]{1,64}$/.test(p))p='web';
var url='https://t.me/CroatianStoriesBot?start='+encodeURIComponent(p);
var btn=document.getElementById('go');btn.href=url;btn.textContent=tx.open;
var tk=/TikTok|musical_ly|Bytedance|trill/i.test(navigator.userAgent||'')||q.get('ua')==='tiktok';
if(tk){var h=document.getElementById('help');h.style.display='block';
h.innerHTML='<h2>'+tx.h+'</h2><ol><li>'+tx.s1+'</li><li>'+tx.s2+'</li><li>'+tx.s3+'</li></ol><p>'+tx.or+'</p><div class="name"><code id="nm">@CroatianStoriesBot</code><button id="cp" type="button">'+tx.copy+'</button></div>';
document.getElementById('cp').onclick=function(){var b=this,t='@CroatianStoriesBot';
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent=tx.ok;},function(){var r=document.createRange();r.selectNodeContents(document.getElementById('nm'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');b.textContent=tx.ok;}catch(e){}});};
}else{setTimeout(function(){location.replace(url);},700);}
})();</script></body></html>
